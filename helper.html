<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Helper</title>
<style>
  :root {
    color-scheme: light;
    --font-sans: "SB Sans Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "SB Sans Text Mono", "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
    --page-bg: #fafafa;
    --panel: #ffffff;
    --text: rgba(0, 0, 0, 0.9);
    --muted: rgba(0, 0, 0, 0.55);
    --border: #e6e6e6;
    --border-strong: #cccccc;
    --blue: #385ee0;
    --blue-tint: #ebf1ff;
    --purple: #6e3fb2;
    --purple-tint: #eee8fb;
    --red: #dc2626;
    --red-tint: #fceae7;
    --hover: #f0f0f0;
    --code-bg: #1f2020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--text);
    font-family: var(--font-sans);
    letter-spacing: -0.3px;
    line-height: 1.45;
  }
  main {
    width: min(760px, calc(100vw - 32px));
    margin: 32px auto 60px;
  }
  header {
    display: grid;
    gap: 14px;
    margin-bottom: 18px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
  }
  .header-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 16px;
  }
  .stand-version {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
  }
  .stand-version select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 8px;
    background: #fafafa;
    color: var(--text);
    font: 13px var(--font-sans);
    cursor: pointer;
    outline: none;
  }
  .stand-version select:focus { border-color: rgba(0, 0, 0, 0.35); }
  details.unavailable { margin-top: 18px; }
  details.unavailable > summary {
    cursor: pointer;
    padding: 6px 2px;
    color: var(--muted);
    font-size: 13px;
    user-select: none;
  }
  details.unavailable > .list { margin-top: 6px; opacity: 0.7; }
  h1 .version {
    margin-left: 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0;
  }
  code {
    font-family: var(--font-mono);
  }
  #search {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    background: #fafafa;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #search:focus { border-color: rgba(0, 0, 0, 0.35); }
  #empty-state {
    display: none;
    padding: 24px 0;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  details.item {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
  }
  summary.item-head {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    user-select: none;
    border-radius: 12px;
  }
  summary.item-head:hover { background: var(--hover); }
  summary.item-head::-webkit-details-marker { display: none; }
  .item-title {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    height: 20px;
    border-radius: 999px;
    padding: 0 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    background: var(--hover);
    white-space: nowrap;
  }
  .tag.pod-heimdall-auth { color: var(--blue); background: var(--blue-tint); }
  .tag.pod-yggdrasil { color: var(--purple); background: var(--purple-tint); }
  .tag.danger { color: var(--red); background: var(--red-tint); }
  .tag.range {
    background: transparent;
    border: 1px solid var(--border);
    font-weight: 400;
  }
  .chevron {
    color: var(--muted);
    font-size: 11px;
    transition: transform 0.15s ease;
  }
  details.item[open] .chevron { transform: rotate(180deg); }
  .item-body {
    padding: 2px 14px 14px;
    display: grid;
    gap: 10px;
    min-width: 0;
  }
  .hint {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
  }
  .fields {
    display: grid;
    gap: 10px;
    min-width: 0;
  }
  .field label {
    display: block;
    margin-bottom: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .field textarea,
  .field input[type="text"],
  .field input[type="email"],
  .field select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    background: #fafafa;
    color: var(--text);
    font: 13px/1.5 var(--font-mono);
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field select { font-family: var(--font-sans); cursor: pointer; }
  .field textarea {
    min-height: 68px;
    resize: vertical;
  }
  .field textarea:focus,
  .field input:focus,
  .field select:focus { border-color: rgba(0, 0, 0, 0.35); }
  .output-wrap {
    position: relative;
    min-width: 0;
    overflow: hidden;
    border-radius: 8px;
  }
  button.copy-btn {
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 8px;
    right: 8px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.65);
    width: 28px;
    height: 28px;
    padding: 0;
    backdrop-filter: blur(2px);
  }
  button.copy-btn:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
  button.copy-btn.copied { color: #6fe3a0; border-color: rgba(111, 227, 160, 0.4); background: rgba(63, 208, 112, 0.18); }
  button.copy-btn svg { width: 14px; height: 14px; }
  button.copy-btn .icon-check { display: none; }
  button.copy-btn.copied .icon-copy { display: none; }
  button.copy-btn.copied .icon-check { display: block; }
  pre.output {
    max-height: 320px;
    margin: 0;
    padding: 12px 44px 12px 12px;
    overflow: auto;
    border-radius: 8px;
    background: var(--code-bg);
    color: #eef4ff;
    font: 12px/1.45 var(--font-mono);
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="header-row">
      <h1>Helper <span class="version" id="version"></span></h1>
      <label class="stand-version">Версия стенда
        <select id="stand-version"></select>
      </label>
    </div>
    <input id="search" type="text" placeholder="Поиск команд…" autocomplete="off" autofocus />
  </header>

  <div class="list" id="list"></div>
  <div id="empty-state">Ничего не найдено</div>
  <details class="unavailable" id="unavailable" hidden>
    <summary id="unavailable-title"></summary>
    <div class="list" id="unavailable-list"></div>
  </details>
</main>

<script>
const RELEASES = [
  "26.07.1", "26.07.2", "26.07.3",
  "26.08.1", "26.08.2", "26.08.3", "26.08.4",
  "26.09.1", "26.09.2", "26.09.3", "26.09.4",
];
const LATEST_RELEASE = RELEASES[RELEASES.length - 1];
const MASTER_VERSION = "master";
const VERSION_LABELS = { [MASTER_VERSION]: "master / dev-стенд" };
const VERSION_STORAGE_KEY = "helper.stand-version";

function compareVersions(left, right) {
  if (left === right) return 0;
  if (left === MASTER_VERSION) return 1;
  if (right === MASTER_VERSION) return -1;
  const leftParts = left.split(".").map(Number);
  const rightParts = right.split(".").map(Number);
  for (let index = 0; index < Math.max(leftParts.length, rightParts.length); index += 1) {
    const difference = (leftParts[index] || 0) - (rightParts[index] || 0);
    if (difference !== 0) return difference;
  }
  return 0;
}

function isAvailableIn(cmd, version) {
  if (cmd.after && compareVersions(version, cmd.after) <= 0) return false;
  if (cmd.until && compareVersions(version, cmd.until) > 0) return false;
  return true;
}

function versionRangeLabel(cmd) {
  const bounds = [];
  if (cmd.after) bounds.push(`новее ${cmd.after}`);
  if (cmd.until) bounds.push(`до ${cmd.until}`);
  return bounds.join(" · ");
}

function versionLabel(version) {
  return VERSION_LABELS[version] || version;
}

function parseEmailList(raw) {
  const seen = new Set();
  const result = [];
  for (const part of (raw || "").split(/[\s,;]+/)) {
    const email = part.trim().toLowerCase();
    if (!email || seen.has(email)) continue;
    seen.add(email);
    result.push(email);
  }
  return result;
}

function emailsPy(list) {
  return JSON.stringify(list);
}

function emailPy(value) {
  return JSON.stringify((value || "").trim().toLowerCase());
}

function passwordPy(value) {
  const trimmed = (value || "").trim();
  return trimmed ? JSON.stringify(trimmed) : "None";
}

function fioPy(value) {
  const trimmed = (value || "").trim();
  return trimmed ? JSON.stringify(trimmed) : "None";
}

function roleNamePy(value) {
  return JSON.stringify((value || "").trim() || "Администратор");
}

function secretPy(value) {
  return JSON.stringify((value || "").trim());
}

const POD_HEIMDALL = "heimdall-auth";
const POD_YGGDRASIL = "yggdrasil";

const COMMANDS = [
  {
    id: "invite-users",
    title: "1. Пригласить пользователей",
    pods: [POD_HEIMDALL],

    render: (v) => `/app/services/auth/.venv/bin/python <<'PY'
import json, os, sys, urllib.error, urllib.request

TOKEN_ENV_NAMES = (

    "SLEIPNIR_GLOBAL_INTERNAL_PLATFORM_API_KEY",
    "SLEIPNIR_INTERNAL_PLATFORM_API_KEY",

TOKEN = next((value for value in (os.environ.get(name, "").strip() for name in TOKEN_ENV_NAMES) if value), "")

if not EMAILS:
    print(f"{RED}ERROR:{RESET} заполните поле email")
    sys.exit(2)
if any("@" not in email for email in EMAILS):
    print(f"{RED}ERROR:{RESET} invalid email list:", EMAILS)
    sys.exit(2)
if not TOKEN:
    print(f"{RED}ERROR:{RESET} не задана ни одна из переменных: " + ", ".join(TOKEN_ENV_NAMES))
    sys.exit(2)

req = urllib.request.Request(
    "http://localhost:8010/api/v1/invitations",
    data=json.dumps({"emails": EMAILS}).encode(),
    headers={"content-type": "application/json", "authorization": f"Bearer {TOKEN}"},
    method="POST",

print(f"приглашаю {len(EMAILS)} email:")
for email in EMAILS:
    print(" -", email)
print("")

try:
    with urllib.request.urlopen(req, timeout=60) as response:
        print(f"{GREEN}[OK]{RESET} status={response.status}")
        print(response.read().decode("utf-8"))
except urllib.error.HTTPError as error:

import asyncio, os, sys, httpx
from sqlalchemy import select
try:
    from auth_service.bootstrap.config import UserManagementMode, get_settings
except ModuleNotFoundError:
    from auth_service.config import UserManagementMode, get_settings
try:
    from auth_service.infrastructure.db.client import Database

try:

_ESC = chr(27)

    "SLEIPNIR_GLOBAL_INTERNAL_PLATFORM_API_KEY",
    "SLEIPNIR_INTERNAL_PLATFORM_API_KEY",
)
TOKEN = next((value for value in (os.environ.get(name, "").strip() for name in TOKEN_ENV_NAMES) if value), "")

async def resolve_role_id(settings):
    db = Database(settings)
    try:
        async with db.session() as session:
            result = await session.execute(
                select(GlobalRoleModel).where(GlobalRoleModel.name == ROLE_NAME)
            )
            role = result.scalar_one_or_none()
            if role is not None:
                return role.role_id
            names = (await session.execute(select(GlobalRoleModel.name).order_by(GlobalRoleModel.name))).scalars()
            print(f"{RED}ERROR:{RESET} роль {ROLE_NAME!r} не найдена в global_roles")
            print("доступные роли:", ", ".join(names) or "<пусто>")
            sys.exit(2)
    finally:
        await db.close()

async def main():
    if not EMAILS:
        print(f"{RED}ERROR:{RESET} заполните поле email")
        sys.exit(2)
    if any("@" not in email for email in EMAILS):
        print(f"{RED}ERROR:{RESET} invalid email list:", EMAILS)
        sys.exit(2)
    if not TOKEN:
        print(f"{RED}ERROR:{RESET} не задана ни одна из переменных: " + ", ".join(TOKEN_ENV_NAMES))
        sys.exit(2)

    settings = get_settings()
    if settings.user_management_mode is not UserManagementMode.LOCAL:
        print(f"{RED}ERROR:{RESET} стенд в режиме {settings.user_management_mode.value} — роли приходят из IdM, выбрать роль при инвайте нельзя")
        print("пригласите карточкой 1, после первого входа выдайте доступ карточкой 3")
        sys.exit(2)

    role_id = await resolve_role_id(settings)

    print(f"приглашаю {len(EMAILS)} email с ролью {ROLE_NAME!r} (role_id={role_id}):")
    for email in EMAILS:
        print(" -", email)
    print("")

    try:
        async with httpx.AsyncClient(timeout=60, trust_env=False) as http:
            response = await http.post(
                "http://localhost:8010/api/v1/invitations",
                json={"emails": EMAILS, "role_ids": [str(role_id)]},
                headers={"authorization": f"Bearer {TOKEN}"},
            )
    except httpx.HTTPError as error:
        print(f"{RED}[FAIL]{RESET} heimdall-auth недоступен на localhost:8010: {error!r}")
        sys.exit(1)

    if response.status_code >= 400:
        print(f"{RED}[FAIL]{RESET} status={response.status_code}")
        print(response.text)
        sys.exit(1)

    payload = response.json()
    stale = 0
    for item in payload.get("items", []):
        status = str(item.get("status"))
        if status == "sent":
            print(f"{GREEN}[SENT]{RESET} {item.get('email')}")
        else:
            print(f"{YELLOW}[{status.upper()}]{RESET} {item.get('email')}")
            if status == "already_registered":
                stale += 1

    print("")
    print(f"итого: запрошено={payload.get('requested')} отправлено={payload.get('sent')}")
    if stale:
        print(f"{YELLOW}примечание:{RESET} {stale} уже зарегистрированы — роль им выдаст карточка 3")

asyncio.run(main())

function fieldMarkup(cmdId, field) {
  const fieldId = `${cmdId}__${field.id}`;
  if (field.type === "emails") {
    return `<div class="field" data-field-id="${field.id}">
      <label for="${fieldId}">${field.label}</label>
      <textarea id="${fieldId}" placeholder="${field.placeholder || ""}" autocomplete="off"></textarea>
    </div>`;
  }
  if (field.type === "email") {
    return `<div class="field" data-field-id="${field.id}">
      <label for="${fieldId}">${field.label}</label>
      <input id="${fieldId}" type="email" placeholder="${field.placeholder || ""}" autocomplete="off" />
    </div>`;
  }
  if (field.type === "password") {
    return `<div class="field" data-field-id="${field.id}">
      <label for="${fieldId}">${field.label}</label>
      <input id="${fieldId}" type="text" placeholder="${field.placeholder || ""}" autocomplete="off" />
    </div>`;
  }
  if (field.type === "text") {
    return `<div class="field" data-field-id="${field.id}">
      <label for="${fieldId}">${field.label}</label>
      <input id="${fieldId}" type="text" placeholder="${field.placeholder || ""}" autocomplete="off" />
    </div>`;
  }
  if (field.type === "select") {
    const opts = field.options.map((o) => `<option value="${o.value}">${o.label}</option>`).join("");
    return `<div class="field" data-field-id="${field.id}">
      <label for="${fieldId}">${field.label}</label>
      <select id="${fieldId}">${opts}</select>
    </div>`;
  }
  return "";
}

    if (field.type === "emails") values[field.id] = parseEmailList(raw);
    else if (field.type === "email") values[field.id] = raw;
    else if (field.type === "password") values[field.id] = raw;
    else values[field.id] = raw;
  }
  return values;
}

    try {
      await navigator.clipboard.writeText(output.textContent);
      copyBtn.classList.add("copied");
      setTimeout(() => { copyBtn.classList.remove("copied"); }, 1200);
    } catch (e) {
      alert("Не удалось скопировать: " + e);
    }
  });

  update();
  return details;
}

const listEl = document.getElementById("list");
const emptyState = document.getElementById("empty-state");
const unavailableEl = document.getElementById("unavailable");
const unavailableTitle = document.getElementById("unavailable-title");
const unavailableListEl = document.getElementById("unavailable-list");
const versionSelect = document.getElementById("stand-version");
const searchInput = document.getElementById("search");
const items = COMMANDS.map((cmd) => ({ cmd, element: buildItem(cmd) }));

function readStoredVersion() {
  try {
    return localStorage.getItem(VERSION_STORAGE_KEY);
  } catch (error) {
    return null;
  }
}

function storeVersion(version) {
  try {
    localStorage.setItem(VERSION_STORAGE_KEY, version);
  } catch (error) {
    console.warn("Не удалось запомнить версию стенда:", error);
  }
}

function placeItems() {
  const version = versionSelect.value;
  for (const { cmd, element } of items) {
    const targetList = isAvailableIn(cmd, version) ? listEl : unavailableListEl;
    targetList.appendChild(element);
  }
  applySearch();
}

function applySearch() {
  const query = searchInput.value.trim().toLowerCase();
  let availableCount = 0;
  let unavailableCount = 0;
  for (const { element } of items) {
    const match = !query || element.dataset.searchText.includes(query);
    element.hidden = !match;
    if (!match) continue;
    if (element.parentElement === listEl) availableCount += 1;
    else unavailableCount += 1;
  }
  unavailableTitle.textContent = `Недоступно для ${versionLabel(versionSelect.value)} (${unavailableCount})`;
  unavailableEl.hidden = unavailableCount === 0;
  emptyState.style.display = availableCount + unavailableCount === 0 ? "block" : "none";
}

const versionOptions = [MASTER_VERSION, ...[...RELEASES].reverse()];
versionSelect.innerHTML = versionOptions
  .map((version) => `<option value="${version}">${versionLabel(version)}</option>`)
  .join("");
const storedVersion = readStoredVersion();
versionSelect.value = versionOptions.includes(storedVersion) ? storedVersion : LATEST_RELEASE;
versionSelect.addEventListener("change", () => {
  storeVersion(versionSelect.value);
  placeItems();
});

document.getElementById("version").textContent = LATEST_RELEASE;
searchInput.addEventListener("input", applySearch);
placeItems();
</script>
</body>
</html>
