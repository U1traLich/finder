<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Helper</title>
<style>
  :root {
    color-scheme: light;
    --font-sans: "SB Sans Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "SB Sans Text Mono", "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
    --page-bg: #fafafa;
    --panel: #ffffff;
    --text: rgba(0, 0, 0, 0.9);
    --muted: rgba(0, 0, 0, 0.55);
    --border: #e6e6e6;
    --border-strong: #cccccc;
    --blue: #385ee0;
    --blue-tint: #ebf1ff;
    --purple: #6e3fb2;
    --purple-tint: #eee8fb;
    --red: #dc2626;
    --red-tint: #fceae7;
    --hover: #f0f0f0;
    --code-bg: #1f2020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--text);
    font-family: var(--font-sans);
    letter-spacing: -0.3px;
    line-height: 1.45;
  }
  main {
    width: min(760px, calc(100vw - 32px));
    margin: 32px auto 60px;
  }
  header {
    display: grid;
    gap: 14px;
    margin-bottom: 18px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
  }
  h1 .version {
    margin-left: 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0;
  }
  code {
    font-family: var(--font-mono);
  }
  #search {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    background: #fafafa;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #search:focus { border-color: rgba(0, 0, 0, 0.35); }
  #empty-state {
    display: none;
    padding: 24px 0;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  details.item {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
  }
  summary.item-head {
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    user-select: none;
    border-radius: 12px;
  }
  summary.item-head:hover { background: var(--hover); }
  summary.item-head::-webkit-details-marker { display: none; }
  .item-title {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    height: 20px;
    border-radius: 999px;
    padding: 0 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    background: var(--hover);
    white-space: nowrap;
  }
  .tag.pod-heimdall-auth { color: var(--blue); background: var(--blue-tint); }
  .tag.pod-yggdrasil { color: var(--purple); background: var(--purple-tint); }
  .tag.danger { color: var(--red); background: var(--red-tint); }
  .chevron {
    color: var(--muted);
    font-size: 11px;
    transition: transform 0.15s ease;
  }
  details.item[open] .chevron { transform: rotate(180deg); }
  .item-body {
    padding: 2px 14px 14px;
    display: grid;
    gap: 10px;
    min-width: 0;
  }
  .hint {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
  }
  .fields {
    display: grid;
    gap: 10px;
    min-width: 0;
  }
  .field label {
    display: block;
    margin-bottom: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .field textarea,
  .field input[type="text"],
  .field input[type="email"],
  .field select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    background: #fafafa;
    color: var(--text);
    font: 13px/1.5 var(--font-mono);
    outline: none;
    transition: border-color 0.15s ease;
  }
  .field select { font-family: var(--font-sans); cursor: pointer; }
  .field textarea {
    min-height: 68px;
    resize: vertical;
  }
  .field textarea:focus,
  .field input:focus,
  .field select:focus { border-color: rgba(0, 0, 0, 0.35); }
  .output-wrap {
    position: relative;
    min-width: 0;
    overflow: hidden;
    border-radius: 8px;
  }
  button.copy-btn {
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 8px;
    right: 8px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.65);
    width: 28px;
    height: 28px;
    padding: 0;
    backdrop-filter: blur(2px);
  }
  button.copy-btn:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
  button.copy-btn.copied { color: #6fe3a0; border-color: rgba(111, 227, 160, 0.4); background: rgba(63, 208, 112, 0.18); }
  button.copy-btn svg { width: 14px; height: 14px; }
  button.copy-btn .icon-check { display: none; }
  button.copy-btn.copied .icon-copy { display: none; }
  button.copy-btn.copied .icon-check { display: block; }
  pre.output {
    max-height: 320px;
    margin: 0;
    padding: 12px 44px 12px 12px;
    overflow: auto;
    border-radius: 8px;
    background: var(--code-bg);
    color: #eef4ff;
    font: 12px/1.45 var(--font-mono);
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Helper <span class="version" id="version"></span></h1>
    <input id="search" type="text" placeholder="Поиск команд…" autocomplete="off" autofocus />
  </header>

  <div class="list" id="list"></div>
  <div id="empty-state">Ничего не найдено</div>
</main>

<script>
const HELPER_VERSION = "08.09.2026";

function parseEmailList(raw) {
  const seen = new Set();
  const result = [];
  for (const part of (raw || "").split(/[\s,;]+/)) {
    const email = part.trim().toLowerCase();
    if (!email || seen.has(email)) continue;
    seen.add(email);
    result.push(email);
  }
  return result;
}

function emailsPy(list) {
  return JSON.stringify(list);
}

function emailPy(value) {
  return JSON.stringify((value || "").trim().toLowerCase());
}

function passwordPy(value) {
  const trimmed = (value || "").trim();
  return trimmed ? JSON.stringify(trimmed) : "None";
}

function fioPy(value) {
  const trimmed = (value || "").trim();
  return trimmed ? JSON.stringify(trimmed) : "None";
}

function roleNamePy(value) {
  return JSON.stringify((value || "").trim() || "Администратор");
}

function secretPy(value) {
  return JSON.stringify((value || "").trim());
}

const POD_HEIMDALL = "heimdall-auth";
const POD_YGGDRASIL = "yggdrasil";

const COMMANDS = [
  {
    id: "invite-users",

    pods: [POD_HEIMDALL],
    hint: "Один batch-запрос на весь список.",
    fields: [
      { id: "emails", type: "emails", label: "Email", placeholder: "user1@example.com\nuser2@example.com" },

    render: (v) => `/app/services/auth/.venv/bin/python <<'PY'
import json, os, sys, urllib.error, urllib.request

_ESC = chr(27)
GREEN, RED, YELLOW, RESET = f"{_ESC}[32m", f"{_ESC}[31m", f"{_ESC}[33m", f"{_ESC}[0m"

EMAILS = ${emailsPy(v.emails)}
TOKEN_ENV_NAMES = (
    "AUTH_INTERNAL_BFF_ACCESS_TOKEN_SECRET",
    "SLEIPNIR_LOCAL_INTERNAL_PLATFORM_API_KEY",
    "SLEIPNIR_GLOBAL_INTERNAL_PLATFORM_API_KEY",
    "SLEIPNIR_INTERNAL_PLATFORM_API_KEY",
)
TOKEN = next((value for value in (os.environ.get(name, "").strip() for name in TOKEN_ENV_NAMES) if value), "")

if not EMAILS:
    print(f"{RED}ERROR:{RESET} заполните поле email")

if any("@" not in email for email in EMAILS):
    print(f"{RED}ERROR:{RESET} invalid email list:", EMAILS)

if not TOKEN:
    print(f"{RED}ERROR:{RESET} не задана ни одна из переменных: " + ", ".join(TOKEN_ENV_NAMES))
    sys.exit(2)

req = urllib.request.Request(
    "http://localhost:8010/api/v1/invitations",
    data=json.dumps({"emails": EMAILS}).encode(),
    headers={"content-type": "application/json", "authorization": f"Bearer {TOKEN}"},
    method="POST",

print(f"приглашаю {len(EMAILS)} email:")
for email in EMAILS:
    print(" -", email)
print("")

try:
    with urllib.request.urlopen(req, timeout=60) as response:
        print(f"{GREEN}[OK]{RESET} status={response.status}")
        print(response.read().decode("utf-8"))
except urllib.error.HTTPError as error:
    print(f"{RED}[FAIL]{RESET} status={error.code}")
    print(error.read().decode("utf-8"))

except urllib.error.URLError as error:

    sys.exit(1)

  {
    id: "invite-admins",
    title: "2. Пригласить админов",
    pods: [POD_HEIMDALL],
    hint: "Приглашение с зарезервированной ролью: на accept пользователь получает её вместо дефолтного «Участника». Уже зарегистрированному роль так не выдать — для него карточка 3.",
    fields: [

import asyncio, os, sys, httpx
from sqlalchemy import select
try:
    from auth_service.bootstrap.config import UserManagementMode, get_settings
except ModuleNotFoundError:
    from auth_service.config import UserManagementMode, get_settings
try:
    from auth_service.infrastructure.db.client import Database
except ModuleNotFoundError:
    from auth_service.db.client import Database
try:
    from auth_service.infrastructure.db.tables import GlobalRoleModel
except ModuleNotFoundError:
    try:
        from auth_service.db.tables import GlobalRoleModel
    except ModuleNotFoundError:
        from auth_service.db.migration_models import GlobalRoleModel

_ESC = chr(27)
GREEN, RED, YELLOW, RESET = f"{_ESC}[32m", f"{_ESC}[31m", f"{_ESC}[33m", f"{_ESC}[0m"

EMAILS = ${emailsPy(v.emails)}
ROLE_NAME = ${roleNamePy(v.role)}
TOKEN_ENV_NAMES = (
    "AUTH_INTERNAL_BFF_ACCESS_TOKEN_SECRET",
    "SLEIPNIR_LOCAL_INTERNAL_PLATFORM_API_KEY",
    "SLEIPNIR_GLOBAL_INTERNAL_PLATFORM_API_KEY",
    "SLEIPNIR_INTERNAL_PLATFORM_API_KEY",
)
TOKEN = next((value for value in (os.environ.get(name, "").strip() for name in TOKEN_ENV_NAMES) if value), "")

async def resolve_role_id(settings):
    db = Database(settings)
    try:
        async with db.session() as session:
            result = await session.execute(
                select(GlobalRoleModel).where(GlobalRoleModel.name == ROLE_NAME)
            )
            role = result.scalar_one_or_none()
            if role is not None:
                return role.role_id
            names = (await session.execute(select(GlobalRoleModel.name).order_by(GlobalRoleModel.name))).scalars()
            print(f"{RED}ERROR:{RESET} роль {ROLE_NAME!r} не найдена в global_roles")
            print("доступные роли:", ", ".join(names) or "<пусто>")
            sys.exit(2)
    finally:
        await db.close()

async def main():
    if not EMAILS:
        print(f"{RED}ERROR:{RESET} заполните поле email")
        sys.exit(2)
    if any("@" not in email for email in EMAILS):
        print(f"{RED}ERROR:{RESET} invalid email list:", EMAILS)
        sys.exit(2)
    if not TOKEN:
        print(f"{RED}ERROR:{RESET} не задана ни одна из переменных: " + ", ".join(TOKEN_ENV_NAMES))
        sys.exit(2)

    settings = get_settings()
    if settings.user_management_mode is not UserManagementMode.LOCAL:
        print(f"{RED}ERROR:{RESET} стенд в режиме {settings.user_management_mode.value} — роли приходят из IdM, выбрать роль при инвайте нельзя")
        print("пригласите карточкой 1, после первого входа выдайте доступ карточкой 3")
        sys.exit(2)

    role_id = await resolve_role_id(settings)

    print(f"приглашаю {len(EMAILS)} email с ролью {ROLE_NAME!r} (role_id={role_id}):")
    for email in EMAILS:
        print(" -", email)
    print("")

    try:
        async with httpx.AsyncClient(timeout=60, trust_env=False) as http:
            response = await http.post(
                "http://localhost:8010/api/v1/invitations",
                json={"emails": EMAILS, "role_ids": [str(role_id)]},
                headers={"authorization": f"Bearer {TOKEN}"},
            )
    except httpx.HTTPError as error:
        print(f"{RED}[FAIL]{RESET} heimdall-auth недоступен на localhost:8010: {error!r}")
        sys.exit(1)

    if response.status_code >= 400:
        print(f"{RED}[FAIL]{RESET} status={response.status_code}")
        print(response.text)
        sys.exit(1)

    payload = response.json()
    stale = 0
    for item in payload.get("items", []):
        status = str(item.get("status"))
        if status == "sent":
            print(f"{GREEN}[SENT]{RESET} {item.get('email')}")
        else:
            print(f"{YELLOW}[{status.upper()}]{RESET} {item.get('email')}")
            if status == "already_registered":
                stale += 1

    print("")
    print(f"итого: запрошено={payload.get('requested')} отправлено={payload.get('sent')}")
    if stale:
        print(f"{YELLOW}примечание:{RESET} {stale} уже зарегистрированы — роль им выдаст карточка 3")

asyncio.run(main())

import asyncio, sys, httpx
from contextlib import AsyncExitStack
try:
    from auth_sdk import AuthClient, KeycloakProviderConfig
except ModuleNotFoundError:
    from heimdall_auth import AuthClient, KeycloakProviderConfig
from auth_service.cli.rbac.errors import RoleNotFoundError
from auth_service.cli.rbac.service import RbacCliService

except ModuleNotFoundError:

try:
    from auth_service.infrastructure.db.client import Database
except ModuleNotFoundError:
    from auth_service.db.client import Database
try:
    from auth_service.infrastructure.db.transactions import DatabaseTransactionManager
except ModuleNotFoundError:
    from auth_service.db.transactions import DatabaseTransactionManager
from auth_service.features.permissions.manifest_loader import load_permission_manifests
from auth_service.features.permissions.repository import PermissionRepository
from auth_service.features.permissions.service import PermissionService
from auth_service.features.rbac.read_repository import RbacReadRepository
from auth_service.features.rbac.write_repository import RbacWriteRepository
from auth_service.main import PERMISSIONS_DIR

_ESC = chr(27)
GREEN, RED, YELLOW, RESET = f"{_ESC}[32m", f"{_ESC}[31m", f"{_ESC}[33m", f"{_ESC}[0m"

EMAILS = ${emailsPy(v.emails)}
ROLE_NAME = "Администратор"
ADMIN_GRANTS = (
    ("admin", "global", "admin.admin"),
    ("admin.users", "global", "admin.users.admin"),
    ("admin.connectors", "global", "admin.connectors.admin"),
)

async def main():
    if not EMAILS:
        print(f"{RED}ERROR:{RESET} заполните поле email")
        sys.exit(2)
    if any("@" not in email for email in EMAILS):
        print(f"{RED}ERROR:{RESET} invalid email list:", EMAILS)
        sys.exit(2)

    settings = get_settings()
    db = Database(settings)
    ok = 0
    failed = 0
    async with AsyncExitStack() as stack:
        stack.push_async_callback(db.close)
        session = await stack.enter_async_context(db.session())
        permission_service = PermissionService(
            repository=PermissionRepository(session),
            registry=load_permission_manifests(PERMISSIONS_DIR),
            transaction_manager=DatabaseTransactionManager(session),
        )
        rbac_service = RbacCliService(
            read_repository=RbacReadRepository(session),
            write_repository=RbacWriteRepository(session),
        )
        async with httpx.AsyncClient() as http:
            auth_client = AuthClient(
                config=KeycloakProviderConfig(
                    issuer_url=settings.provider_issuer_url,
                    realm=settings.provider_realm,
                    client_id=settings.provider_client_id,
                    client_secret=settings.provider_client_secret,
                ),
                http_client=http,
            )
            for email in EMAILS:
                user = await auth_client.find_user_by_email(email=email)
                if user is None:
                    print(f"{RED}[FAIL]{RESET} {email}: user not found in provider")
                    failed += 1
                    continue
                granted_roles = []
                for namespace, resource_id, role_id in ADMIN_GRANTS:
                    grant = await permission_service.grant_access(
                        user_id=user.id,
                        namespace=namespace,
                        resource_id=resource_id,
                        role_id=role_id,
                    )
                    granted_roles.append(f"{grant.namespace}/{grant.resource_id}/{grant.role_id}")
                try:
                    is_new = await rbac_service.grant_role(
                        user_id=user.id, role_name=ROLE_NAME, operator="admin-helper"
                    )
                    await session.commit()
                    rbac_status = "назначена" if is_new else "уже была"
                    marker = f"{GREEN}[OK]{RESET}"
                    ok += 1
                except RoleNotFoundError:
                    await session.rollback()
                    rbac_status = f"{RED}роль не найдена — прогоните карточку 18{RESET}"
                    marker = f"{YELLOW}[PARTIAL]{RESET}"
                    failed += 1
                print(f"{marker} {email}: user_id={user.id}")
                print(f"  RBAC-роль {ROLE_NAME!r}: {rbac_status}")
                print(f"  legacy grants: {', '.join(granted_roles)}")

    print("")
    print(f"итого: ok={ok} failed={failed}")
    if failed:
        sys.exit(1)

asyncio.run(main())

def resolve_role_id(registry):
    namespace = registry.find_namespace(NAMESPACE)
    if namespace is None:
        available = ", ".join(sorted(registry.namespaces)) or "<empty>"
        print(f"{RED}ERROR:{RESET} namespace {NAMESPACE!r} is not registered in this pod image")
        print(f"available namespaces: {available}")

    if namespace.has_role(ROLE_ID):

            print(f"{RED}ERROR:{RESET} role {ROLE_ID!r} exists, but does not grant {REQUIRED_PERMISSION!r}")
            sys.exit(2)

    fallback_roles = [
        role.id
        for role in namespace.roles
        if REQUIRED_PERMISSION in namespace.permissions_by_role(role.id)
    ]
    if len(fallback_roles) == 1:
        fallback_role_id = fallback_roles[0]
        print(f"{YELLOW}[WARN]{RESET} role {ROLE_ID!r} is absent in this pod image; using {fallback_role_id!r}, the only role that grants {REQUIRED_PERMISSION!r}")
        return fallback_role_id
    print(f"{RED}ERROR:{RESET} role {ROLE_ID!r} is not registered in namespace {NAMESPACE!r}")
    print("roles granting manage:", fallback_roles or "<none>")
    print("Fix the pod image manifest or choose the correct role explicitly.")
    sys.exit(2)

async def main():

function fieldMarkup(cmdId, field) {
  const fieldId = `${cmdId}__${field.id}`;
  if (field.type === "emails") {
    return `<div class="field" data-field-id="${field.id}">
      <label for="${fieldId}">${field.label}</label>
      <textarea id="${fieldId}" placeholder="${field.placeholder || ""}" autocomplete="off"></textarea>
    </div>`;
  }
  if (field.type === "email") {
    return `<div class="field" data-field-id="${field.id}">
      <label for="${fieldId}">${field.label}</label>
      <input id="${fieldId}" type="email" placeholder="${field.placeholder || ""}" autocomplete="off" />
    </div>`;
  }
  if (field.type === "password") {
    return `<div class="field" data-field-id="${field.id}">
      <label for="${fieldId}">${field.label}</label>
      <input id="${fieldId}" type="text" placeholder="${field.placeholder || ""}" autocomplete="off" />
    </div>`;
  }
  if (field.type === "text") {
    return `<div class="field" data-field-id="${field.id}">
      <label for="${fieldId}">${field.label}</label>
      <input id="${fieldId}" type="text" placeholder="${field.placeholder || ""}" autocomplete="off" />
    </div>`;
  }
  if (field.type === "select") {
    const opts = field.options.map((o) => `<option value="${o.value}">${o.label}</option>`).join("");
    return `<div class="field" data-field-id="${field.id}">
      <label for="${fieldId}">${field.label}</label>
      <select id="${fieldId}">${opts}</select>
    </div>`;
  }
  return "";
}

function collectValues(details, cmd) {
  const values = {};
  for (const field of cmd.fields) {
    const el = details.querySelector(`[data-field-id="${field.id}"] [id]`);
    const raw = el.value;
    if (field.type === "emails") values[field.id] = parseEmailList(raw);
    else if (field.type === "email") values[field.id] = raw;
    else if (field.type === "password") values[field.id] = raw;
    else values[field.id] = raw;
  }
  return values;
}

function buildItem(cmd) {
  const details = document.createElement("details");

  const dangerTag = cmd.danger ? `<span class="tag danger">опасно</span>` : "";

  details.innerHTML = `
    <summary class="item-head">
      <span class="item-title">${cmd.title}</span>
      ${podTags}
      ${dangerTag}
      <span class="chevron">&#9662;</span>
    </summary>
    <div class="item-body">
      <p class="hint">${cmd.hint}</p>

          <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
        <pre class="output"></pre>
      </div>
    </div>
  `;

  const output = details.querySelector(".output");
  const copyBtn = details.querySelector(".copy-btn");

  function update() {
    const values = collectValues(details, cmd);
    output.textContent = cmd.render(values);
  }

  details.querySelectorAll(".fields [id]").forEach((el) => {
    el.addEventListener("input", update);
    el.addEventListener("change", update);
